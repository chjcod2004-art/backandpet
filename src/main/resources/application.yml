spring:
  application:
    name: backandpet
  profiles:
    default: local

  datasource:
    url: "jdbc:mysql://localhost:3307/backandpet_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    username: root
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            max-output-tokens: 1024
            temperature: 0.7

resilience4j:
  retry:
    instances:
      geminiApi:
        maxAttempts: 2
        waitDuration: 500ms
      githubApi:
        maxAttempts: 2
        waitDuration: 500ms
  circuitbreaker:
    instances:
      geminiApi:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      githubApi:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 604800000
  crypto:
    aes-key: ${AES_SECRET_KEY}
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}